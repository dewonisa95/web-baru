<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Peringatan Kebisingan & Sound Level Meter</title>

    <!-- CSS eksternal -->
    <link rel="stylesheet" href="style.css">
</head>


<body class="menunggu-mode" id="body">

    <!-- =====================================================
         ORNAMEN BACKGROUND
    ====================================================== -->
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>


    <!-- =====================================================
         DASHBOARD
    ====================================================== -->
    <div class="dashboard-wrapper">

        <!-- =================================================
             KARTU UTAMA
        ================================================== -->
        <div
            class="card menunggu-theme"
            id="mainCard"
        >

            <!-- =================================================
                 HEADER
            ================================================== -->
            <div class="card-header">

                <div class="brand-badge">

                    <div
                        class="status-dot"
                        id="statusDot"
                    ></div>

                    <span id="connectionBadge">
                        Menunggu Sinyal...
                    </span>

                </div>


                <span
                    style="
                        font-size: 0.85rem;
                        color: #64748b;
                        font-weight: 600;
                        letter-spacing: 1px;
                    "
                >
                    ESP32 SENSOR
                </span>

            </div>


            <!-- =================================================
                 STATUS UTAMA
            ================================================== -->
            <div
                class="status-container"
                id="statusContainer"
            >

                <div
                    class="ripple-ring"
                    id="rippleEffect"
                ></div>


                <div
                    class="icon-wrapper"
                    id="statusIcon"
                >
                    ⏳
                </div>


                <h1
                    class="status-title"
                    id="statusText"
                >
                    MENUNGGU
                </h1>


                <div
                    class="status-subtitle"
                    id="statusSub"
                >
                    Menunggu menghubungkan ESP32...
                </div>

            </div>


            <!-- =================================================
                 PANEL DATA
            ================================================== -->
            <div class="bottom-panel">

                <!-- =================================================
                     NILAI dB
                ================================================== -->
                <div class="info-box">

                    <div class="db-info-group">

                        <span class="box-label">
                            🎙️ Intensitas Suara
                        </span>

                        <span class="db-subtext">
                            Ambang Batas: 55 dB
                        </span>

                    </div>


                    <div class="db-value-container">

                        <span
                            class="db-value"
                            id="dbValue"
                        >
                            0.0
                        </span>

                        <span class="db-unit">
                            dB
                        </span>

                    </div>

                </div>


                <!-- =================================================
                     BUZZER
                ================================================== -->
                <div class="info-box">

                    <div class="db-info-group">

                        <span class="box-label">
                            🔔 Alarm Buzzer
                        </span>

                        <span class="db-subtext">
                            Aktifkan peringatan audio
                        </span>

                    </div>


                    <label class="switch">

                        <input
                            type="checkbox"
                            id="buzzerToggle"
                            onchange="toggleBuzzer(this.checked)"
                            checked
                        >

                        <span class="slider"></span>

                    </label>

                </div>

            </div>

        </div>


        <!-- =================================================
             FOOTER
        ================================================== -->
        <div class="footer-info">
            NOISE GUARD SYSTEM &bull; REAL-TIME MONITORING
        </div>

    </div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->
    <script>

        // =====================================================
        // KONFIGURASI POLLING
        // =====================================================

        // Website mengecek Worker setiap 500 ms.
        const POLLING_INTERVAL = 500;


        // =====================================================
        // ELEMENT DASHBOARD
        // =====================================================

        const mainCard =
            document.getElementById("mainCard");

        const statusIcon =
            document.getElementById("statusIcon");

        const statusText =
            document.getElementById("statusText");

        const statusSub =
            document.getElementById("statusSub");

        const statusDot =
            document.getElementById("statusDot");

        const connectionBadge =
            document.getElementById("connectionBadge");

        const dbValue =
            document.getElementById("dbValue");

        const buzzerToggle =
            document.getElementById("buzzerToggle");


        // =====================================================
        // TAMPILKAN ESP32 OFFLINE
        // =====================================================

        function showESP32Offline() {

            // -------------------------------------------------
            // Tema menunggu
            // -------------------------------------------------

            mainCard.className =
                "card menunggu-theme";

            document.body.className =
                "menunggu-mode";


            // -------------------------------------------------
            // STATUS KONEKSI
            // -------------------------------------------------

            connectionBadge.innerText =
                "OFFLINE";

            statusDot.style.backgroundColor =
                "var(--accent-wait)";


            // -------------------------------------------------
            // STATUS UTAMA
            // -------------------------------------------------

            statusIcon.innerHTML =
                "⏳";

            statusText.innerHTML =
                "MENUNGGU";

            statusSub.innerText =
                "Menunggu menghubungkan ESP32...";


            // -------------------------------------------------
            // NILAI dB
            // -------------------------------------------------

            dbValue.innerText =
                "0.0";


            // -------------------------------------------------
            // BUZZER
            // -------------------------------------------------

            buzzerToggle.checked =
                false;

            buzzerToggle.disabled =
                true;
        }


        // =====================================================
        // TAMPILKAN ESP32 TERHUBUNG - AMAN
        // =====================================================

        function showSafeStatus(data) {

            // -------------------------------------------------
            // Tema aman
            // -------------------------------------------------

            mainCard.className =
                "card aman-theme";

            document.body.className =
                "aman-mode";


            // -------------------------------------------------
            // STATUS KONEKSI
            // -------------------------------------------------

            connectionBadge.innerText =
                "TERHUBUNG";

            statusDot.style.backgroundColor =
                "var(--accent-green)";


            // -------------------------------------------------
            // ICON
            // -------------------------------------------------

            statusIcon.innerHTML =
                "🛡️";


            // -------------------------------------------------
            // STATUS
            // -------------------------------------------------

            statusText.innerHTML =
                "AMAN";

            statusSub.innerText =
                "Tingkat Suara Normal & Terkendali";


            // -------------------------------------------------
            // NILAI dB
            // -------------------------------------------------

            const db =
                Number(data.db);

            if (
                Number.isFinite(db)
            ) {

                dbValue.innerText =
                    db.toFixed(1);

            } else {

                dbValue.innerText =
                    "0.0";
            }
        }


        // =====================================================
        // TAMPILKAN ESP32 TERHUBUNG - BAHAYA
        // =====================================================

        function showDangerStatus(data) {

            // -------------------------------------------------
            // Tema bahaya
            // -------------------------------------------------

            mainCard.className =
                "card berisik-theme berisik-card";

            document.body.className =
                "berisik-mode";


            // -------------------------------------------------
            // STATUS KONEKSI
            // -------------------------------------------------

            connectionBadge.innerText =
                "TERHUBUNG";

            statusDot.style.backgroundColor =
                "var(--accent-green)";


            // -------------------------------------------------
            // ICON
            // -------------------------------------------------

            statusIcon.innerHTML =
                "🚨";


            // -------------------------------------------------
            // STATUS
            // -------------------------------------------------

            statusText.innerHTML =
                "BAHAYA!";

            statusSub.innerText =
                "LINGKUNGAN TERLALU BISING (>55 dB)";


            // -------------------------------------------------
            // NILAI dB
            // -------------------------------------------------

            const db =
                Number(data.db);

            if (
                Number.isFinite(db)
            ) {

                dbValue.innerText =
                    db.toFixed(1);

            } else {

                dbValue.innerText =
                    "0.0";
            }
        }


        // =====================================================
        // SINKRONISASI BUZZER
        // =====================================================

        function updateBuzzerState(data) {

            if (!buzzerToggle) {
                return;
            }


            // ESP32 online
            buzzerToggle.disabled =
                false;


            // Jangan mengubah toggle ketika user sedang
            // melakukan klik
            if (
                document.activeElement !==
                buzzerToggle
            ) {

                if (
                    data.buzzer !== undefined
                ) {

                    buzzerToggle.checked =
                        Boolean(data.buzzer);
                }
            }
        }


        // =====================================================
        // KIRIM PERINTAH BUZZER
        // =====================================================

        async function toggleBuzzer(isChecked) {

            try {

                const response =
                    await fetch(
                        `/buzzer?state=${isChecked ? "on" : "off"}`
                    );


                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );
                }


                const result =
                    await response.json();


                console.log(
                    "[BUZZER] Response:",
                    result
                );

            }

            catch (error) {

                console.error(
                    "[BUZZER] Gagal mengubah status:",
                    error
                );

            }
        }


        // =====================================================
        // AMBIL DATA ESP32
        // =====================================================

        async function fetchESP32Data() {

            try {

                // -------------------------------------------------
                // REQUEST KE CLOUDFLARE WORKER
                // -------------------------------------------------

                const response =
                    await fetch(
                        "/api/sensor?t=" +
                        Date.now(),
                        {
                            cache: "no-store"
                        }
                    );


                // -------------------------------------------------
                // CEK HTTP
                // -------------------------------------------------

                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );
                }


                // -------------------------------------------------
                // BACA JSON
                // -------------------------------------------------

                const data =
                    await response.json();


                console.log(
                    "[SENSOR]",
                    data
                );


                // =================================================
                // CEK STATUS ESP32
                // =================================================
                //
                // Worker menentukan apakah ESP32 masih online.
                //
                // online === true
                //     → ESP32 terhubung
                //
                // online !== true
                //     → ESP32 offline
                //

                if (
                    data.online !== true
                ) {

                    showESP32Offline();

                    return;
                }


                // =================================================
                // ESP32 ONLINE
                // =================================================

                if (
                    data.warning === true
                ) {

                    showDangerStatus(
                        data
                    );

                } else {

                    showSafeStatus(
                        data
                    );
                }


                // =================================================
                // UPDATE BUZZER
                // =================================================

                updateBuzzerState(
                    data
                );

            }

            catch (error) {

                // =================================================
                // WORKER / SERVER TIDAK BISA DIAKSES
                // =================================================
                //
                // Ini berbeda dengan ESP32 offline.
                //

                mainCard.className =
                    "card menunggu-theme";

                document.body.className =
                    "menunggu-mode";


                connectionBadge.innerText =
                    "SERVER OFFLINE";


                statusDot.style.backgroundColor =
                    "var(--accent-wait)";


                statusIcon.innerHTML =
                    "⚠️";


                statusText.innerHTML =
                    "KONEKSI TERPUTUS";


                statusSub.innerText =
                    "Tidak dapat menghubungi Cloudflare Worker...";


                dbValue.innerText =
                    "0.0";


                buzzerToggle.checked =
                    false;

                buzzerToggle.disabled =
                    true;


                console.error(
                    "[SERVER ERROR]",
                    error
                );
            }
        }


        // =====================================================
        // POLLING
        // =====================================================

        setInterval(
            fetchESP32Data,
            POLLING_INTERVAL
        );


        // =====================================================
        // REQUEST PERTAMA
        // =====================================================

        fetchESP32Data();

    </script>

</body>

</html>
