<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Peringatan Kebisingan & Sound Level Meter</title>

    <link rel="stylesheet" href="style.css">
</head>


<body class="menunggu-mode" id="body">

    <!-- =====================================================
         ORNAMEN BACKGROUND
    ====================================================== -->

    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>


    <!-- =====================================================
         DASHBOARD
    ====================================================== -->

    <div class="dashboard-wrapper">

        <!-- =================================================
             KARTU UTAMA
        ================================================== -->

        <div class="card menunggu-theme" id="mainCard">


            <!-- =================================================
                 HEADER
            ================================================== -->

            <div class="card-header">

                <div class="brand-badge">

                    <div
                        class="status-dot"
                        id="statusDot"
                    ></div>

                    <span id="connectionBadge">
                        Menunggu Sinyal...
                    </span>

                </div>


                <span
                    style="
                        font-size: 0.85rem;
                        color: #64748b;
                        font-weight: 600;
                        letter-spacing: 1px;
                    "
                >
                    ESP32 SENSOR
                </span>

            </div>


            <!-- =================================================
                 STATUS UTAMA
            ================================================== -->

            <div
                class="status-container"
                id="statusContainer"
            >

                <div
                    class="ripple-ring"
                    id="rippleEffect"
                ></div>


                <div
                    class="icon-wrapper"
                    id="statusIcon"
                >
                    ⏳
                </div>


                <h1
                    class="status-title"
                    id="statusText"
                >
                    MENUNGGU
                </h1>


                <div
                    class="status-subtitle"
                    id="statusSub"
                >
                    Menunggu menghubungkan ESP32...
                </div>

            </div>


            <!-- =================================================
                 PANEL DATA
            ================================================== -->

            <div class="bottom-panel">


                <!-- =================================================
                     NILAI dB
                ================================================== -->

                <div class="info-box">

                    <div class="db-info-group">

                        <span class="box-label">
                            🎙️ Intensitas Suara
                        </span>

                        <span class="db-subtext">
                            Ambang Batas: 55 dB
                        </span>

                    </div>


                    <div class="db-value-container">

                        <span
                            class="db-value"
                            id="dbValue"
                        >
                            0.0
                        </span>

                        <span class="db-unit">
                            dB
                        </span>

                    </div>

                </div>


                <!-- =================================================
                     BUZZER
                ================================================== -->

                <div class="info-box">

                    <div class="db-info-group">

                        <span class="box-label">
                            🔔 Alarm Buzzer
                        </span>

                        <span class="db-subtext">
                            Aktifkan peringatan audio
                        </span>

                    </div>


                    <label class="switch">

                        <input
                            type="checkbox"
                            id="buzzerToggle"
                            onchange="toggleBuzzer(this.checked)"
                            checked
                        >

                        <span class="slider"></span>

                    </label>

                </div>

            </div>

        </div>


        <!-- =================================================
             FOOTER
        ================================================== -->

        <div class="footer-info">
            NOISE GUARD SYSTEM &bull; REAL-TIME MONITORING
        </div>

    </div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        // =====================================================
        // KONFIGURASI
        // =====================================================

        // Website mengecek data setiap 500 ms
        const POLLING_INTERVAL = 500;

        // Data harus masuk terus selama 2 detik
        // sebelum ESP32 dianggap TERHUBUNG
        const CONNECT_DELAY = 2000;


        // =====================================================
        // STATUS KONEKSI
        // =====================================================

        let espOnlineSince = null;
        let espConnected = false;


        // =====================================================
        // ELEMENT
        // =====================================================

        const mainCard =
            document.getElementById("mainCard");

        const statusIcon =
            document.getElementById("statusIcon");

        const statusText =
            document.getElementById("statusText");

        const statusSub =
            document.getElementById("statusSub");

        const statusDot =
            document.getElementById("statusDot");

        const connectionBadge =
            document.getElementById("connectionBadge");

        const dbValue =
            document.getElementById("dbValue");

        const buzzerToggle =
            document.getElementById("buzzerToggle");


        // =====================================================
        // MENUNGGU
        // =====================================================

        function showWaitingStatus() {

            mainCard.className =
                "card menunggu-theme";

            document.body.className =
                "menunggu-mode";


            connectionBadge.innerText =
                "OFFLINE";


            statusDot.style.backgroundColor =
                "var(--accent-wait)";


            statusIcon.innerHTML =
                "⏳";


            statusText.innerHTML =
                "MENUNGGU";


            statusSub.innerText =
                "Menunggu menghubungkan ESP32...";


            dbValue.innerText =
                "0.0";


            buzzerToggle.checked =
                false;


            buzzerToggle.disabled =
                true;
        }


        // =====================================================
        // ESP32 OFFLINE
        // =====================================================

        function showESP32Offline() {

            // Reset timer karena memang tidak ada data
            espOnlineSince = null;

            espConnected = false;

            showWaitingStatus();
        }


        // =====================================================
        // STATUS AMAN
        // =====================================================

        function showSafeStatus(data) {

            mainCard.className =
                "card aman-theme";

            document.body.className =
                "aman-mode";


            connectionBadge.innerText =
                "TERHUBUNG";


            statusDot.style.backgroundColor =
                "var(--accent-green)";


            statusIcon.innerHTML =
                "🛡️";


            statusText.innerHTML =
                "AMAN";


            statusSub.innerText =
                "Tingkat Suara Normal & Terkendali";


            const db =
                Number(data.db);


            if (Number.isFinite(db)) {

                dbValue.innerText =
                    db.toFixed(1);

            } else {

                dbValue.innerText =
                    "0.0";
            }
        }


        // =====================================================
        // STATUS BAHAYA
        // =====================================================

        function showDangerStatus(data) {

            mainCard.className =
                "card berisik-theme berisik-card";

            document.body.className =
                "berisik-mode";


            connectionBadge.innerText =
                "TERHUBUNG";


            statusDot.style.backgroundColor =
                "var(--accent-green)";


            statusIcon.innerHTML =
                "🚨";


            statusText.innerHTML =
                "BAHAYA!";


            statusSub.innerText =
                "LINGKUNGAN TERLALU BISING (>55 dB)";


            const db =
                Number(data.db);


            if (Number.isFinite(db)) {

                dbValue.innerText =
                    db.toFixed(1);

            } else {

                dbValue.innerText =
                    "0.0";
            }
        }


        // =====================================================
        // UPDATE STATUS BUZZER
        // =====================================================

        function updateBuzzerState(data) {

            if (!buzzerToggle) {
                return;
            }


            buzzerToggle.disabled =
                false;


            if (
                document.activeElement !==
                buzzerToggle
            ) {

                if (
                    data.buzzer !== undefined
                ) {

                    buzzerToggle.checked =
                        Boolean(data.buzzer);
                }
            }
        }


        // =====================================================
        // KONTROL BUZZER
        // =====================================================

        async function toggleBuzzer(isChecked) {

            try {

                const response =
                    await fetch(
                        `/buzzer?state=${isChecked ? "on" : "off"}`
                    );


                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );
                }


                const result =
                    await response.json();


                console.log(
                    "[BUZZER]",
                    result
                );

            }

            catch (error) {

                console.error(
                    "[BUZZER] Gagal mengubah status:",
                    error
                );

            }
        }


        // =====================================================
        // AMBIL DATA ESP32
        // =====================================================

        async function fetchESP32Data() {

            try {

                // -------------------------------------------------
                // Request ke Worker
                // -------------------------------------------------

                const response =
                    await fetch(
                        "/api/sensor?t=" +
                        Date.now(),
                        {
                            cache: "no-store"
                        }
                    );


                // -------------------------------------------------
                // HTTP ERROR
                // -------------------------------------------------

                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );
                }


                // -------------------------------------------------
                // JSON
                // -------------------------------------------------

                const data =
                    await response.json();


                console.log(
                    "[SENSOR]",
                    data
                );


                // =================================================
                // ESP32 OFFLINE
                // =================================================

                if (
                    data.online !== true
                ) {

                    showESP32Offline();

                    return;
                }


                // =================================================
                // DATA ESP32 MULAI MASUK
                // =================================================

                // Hanya dijalankan sekali ketika
                // pertama kali menerima data setelah offline.

                if (
                    espOnlineSince === null
                ) {

                    espOnlineSince =
                        Date.now();

                    espConnected =
                        false;


                    console.log(
                        "[ESP32] Data mulai diterima"
                    );


                    console.log(
                        "[ESP32] Menunggu 2 detik..."
                    );


                    // Tampilkan mode menunggu.
                    // PENTING:
                    // fungsi ini TIDAK mereset timer.
                    showWaitingStatus();


                    return;
                }


                // =================================================
                // HITUNG DURASI DATA
                // =================================================

                const connectedTime =
                    Date.now() -
                    espOnlineSince;


                console.log(
                    "[ESP32] Durasi:",
                    connectedTime,
                    "ms"
                );


                // =================================================
                // BELUM 2 DETIK
                // =================================================

                if (
                    connectedTime <
                    CONNECT_DELAY
                ) {

                    espConnected =
                        false;


                    showWaitingStatus();


                    return;
                }


                // =================================================
                // TERHUBUNG
                // =================================================

                espConnected =
                    true;


                // =================================================
                // STATUS AMAN / BAHAYA
                // =================================================

                if (
                    data.warning === true
                ) {

                    showDangerStatus(data);

                } else {

                    showSafeStatus(data);
                }


                // =================================================
                // BUZZER
                // =================================================

                updateBuzzerState(data);

            }

            catch (error) {

                // =================================================
                // SERVER ERROR
                // =================================================

                espOnlineSince =
                    null;

                espConnected =
                    false;


                mainCard.className =
                    "card menunggu-theme";


                document.body.className =
                    "menunggu-mode";


                connectionBadge.innerText =
                    "SERVER OFFLINE";


                statusDot.style.backgroundColor =
                    "var(--accent-wait)";


                statusIcon.innerHTML =
                    "⚠️";


                statusText.innerHTML =
                    "KONEKSI TERPUTUS";


                statusSub.innerText =
                    "Tidak dapat menghubungi Cloudflare Worker...";


                dbValue.innerText =
                    "0.0";


                buzzerToggle.checked =
                    false;


                buzzerToggle.disabled =
                    true;


                console.error(
                    "[SERVER ERROR]",
                    error
                );
            }
        }


        // =====================================================
        // POLLING 500 ms
        // =====================================================

        setInterval(
            fetchESP32Data,
            POLLING_INTERVAL
        );


        // =====================================================
        // REQUEST PERTAMA
        // =====================================================

        fetchESP32Data();

    </script>

</body>

</html>
