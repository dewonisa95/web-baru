<script>

    // =====================================================
    // KONFIGURASI
    // =====================================================

    // Web mengecek data setiap 500 ms
    const POLLING_INTERVAL = 500;

    // ESP32 harus mengirim data terus selama 2 detik
    // sebelum dianggap benar-benar TERHUBUNG
    const CONNECT_DELAY = 2000;


    // =====================================================
    // STATUS KONEKSI
    // =====================================================

    let espOnlineSince = null;
    let espConnected = false;


    // =====================================================
    // ELEMENT DASHBOARD
    // =====================================================

    const mainCard =
        document.getElementById("mainCard");

    const statusIcon =
        document.getElementById("statusIcon");

    const statusText =
        document.getElementById("statusText");

    const statusSub =
        document.getElementById("statusSub");

    const statusDot =
        document.getElementById("statusDot");

    const connectionBadge =
        document.getElementById("connectionBadge");

    const dbValue =
        document.getElementById("dbValue");

    const buzzerToggle =
        document.getElementById("buzzerToggle");


    // =====================================================
    // TAMPILAN MENUNGGU
    // =====================================================
    // FUNGSI INI TIDAK MEReset espOnlineSince
    // supaya timer 2 detik tetap berjalan.
    // =====================================================

    function showWaitingStatus() {

        mainCard.className =
            "card menunggu-theme";

        document.body.className =
            "menunggu-mode";


        connectionBadge.innerText =
            "OFFLINE";

        statusDot.style.backgroundColor =
            "var(--accent-wait)";


        statusIcon.innerHTML =
            "⏳";

        statusText.innerHTML =
            "MENUNGGU";

        statusSub.innerText =
            "Menunggu menghubungkan ESP32...";


        dbValue.innerText =
            "0.0";


        buzzerToggle.checked =
            false;

        buzzerToggle.disabled =
            true;
    }


    // =====================================================
    // ESP32 BENAR-BENAR OFFLINE
    // =====================================================

    function showESP32Offline() {

        // Karena benar-benar offline,
        // timer koneksi di-reset.
        espOnlineSince = null;

        espConnected = false;

        showWaitingStatus();
    }


    // =====================================================
    // STATUS AMAN
    // =====================================================

    function showSafeStatus(data) {

        mainCard.className =
            "card aman-theme";

        document.body.className =
            "aman-mode";


        connectionBadge.innerText =
            "TERHUBUNG";

        statusDot.style.backgroundColor =
            "var(--accent-green)";


        statusIcon.innerHTML =
            "🛡️";


        statusText.innerHTML =
            "AMAN";

        statusSub.innerText =
            "Tingkat Suara Normal & Terkendali";


        const db =
            Number(data.db);

        if (Number.isFinite(db)) {
            dbValue.innerText =
                db.toFixed(1);
        } else {
            dbValue.innerText =
                "0.0";
        }
    }


    // =====================================================
    // STATUS BAHAYA
    // =====================================================

    function showDangerStatus(data) {

        mainCard.className =
            "card berisik-theme berisik-card";

        document.body.className =
            "berisik-mode";


        connectionBadge.innerText =
            "TERHUBUNG";

        statusDot.style.backgroundColor =
            "var(--accent-green)";


        statusIcon.innerHTML =
            "🚨";


        statusText.innerHTML =
            "BAHAYA!";

        statusSub.innerText =
            "LINGKUNGAN TERLALU BISING (>55 dB)";


        const db =
            Number(data.db);

        if (Number.isFinite(db)) {
            dbValue.innerText =
                db.toFixed(1);
        } else {
            dbValue.innerText =
                "0.0";
        }
    }


    // =====================================================
    // SINKRONISASI BUZZER
    // =====================================================

    function updateBuzzerState(data) {

        if (!buzzerToggle) {
            return;
        }


        buzzerToggle.disabled =
            false;


        if (
            document.activeElement !==
            buzzerToggle
        ) {

            if (
                data.buzzer !== undefined
            ) {

                buzzerToggle.checked =
                    Boolean(data.buzzer);
            }
        }
    }


    // =====================================================
    // KONTROL BUZZER
    // =====================================================

    async function toggleBuzzer(isChecked) {

        try {

            const response =
                await fetch(
                    `/buzzer?state=${isChecked ? "on" : "off"}`
                );


            if (!response.ok) {

                throw new Error(
                    `HTTP ${response.status}`
                );
            }


            const result =
                await response.json();


            console.log(
                "[BUZZER] Response:",
                result
            );

        }

        catch (error) {

            console.error(
                "[BUZZER] Gagal mengubah status:",
                error
            );

        }
    }


    // =====================================================
    // AMBIL DATA ESP32
    // =====================================================

    async function fetchESP32Data() {

        try {

            const response =
                await fetch(
                    "/api/sensor?t=" +
                    Date.now(),
                    {
                        cache: "no-store"
                    }
                );


            // =============================================
            // SERVER ERROR
            // =============================================

            if (!response.ok) {

                throw new Error(
                    `HTTP ${response.status}`
                );
            }


            const data =
                await response.json();


            console.log(
                "[SENSOR]",
                data
            );


            // =============================================
            // ESP32 TIDAK MENGIRIM DATA
            // Worker akan memberikan online:false
            // setelah 5 detik tidak menerima data.
            // =============================================

            if (data.online !== true) {

                showESP32Offline();

                return;
            }


            // =============================================
            // DATA ESP32 SUDAH MULAI MASUK
            // =============================================

            if (espOnlineSince === null) {

                espOnlineSince =
                    Date.now();

                espConnected =
                    false;

                console.log(
                    "[ESP32] Data mulai diterima."
                );

                console.log(
                    "[ESP32] Menunggu 2 detik untuk koneksi stabil..."
                );


                // Tampilkan MENUNGGU,
                // TAPI JANGAN reset timer.
                showWaitingStatus();

                return;
            }


            // =============================================
            // HITUNG DURASI DATA MASUK
            // =============================================

            const connectedTime =
                Date.now() -
                espOnlineSince;


            console.log(
                "[ESP32] Stabil selama:",
                connectedTime,
                "ms"
            );


            // =============================================
            // BELUM MENCAPAI 2 DETIK
            // =============================================

            if (
                connectedTime <
                CONNECT_DELAY
            ) {

                espConnected =
                    false;

                showWaitingStatus();

                return;
            }


            // =============================================
            // ESP32 SUDAH TERHUBUNG
            // =============================================

            if (!espConnected) {

                console.log(
                    "[ESP32] TERHUBUNG!"
                );
            }

            espConnected =
                true;


            // =============================================
            // STATUS AMAN / BAHAYA
            // =============================================

            if (
                data.warning === true
            ) {

                showDangerStatus(
                    data
                );

            } else {

                showSafeStatus(
                    data
                );
            }


            // =============================================
            // UPDATE BUZZER
            // =============================================

            updateBuzzerState(
                data
            );

        }

        catch (error) {

            // =============================================
            // SERVER / WORKER ERROR
            // =============================================

            espOnlineSince =
                null;

            espConnected =
                false;


            mainCard.className =
                "card menunggu-theme";

            document.body.className =
                "menunggu-mode";


            connectionBadge.innerText =
                "SERVER OFFLINE";


            statusDot.style.backgroundColor =
                "var(--accent-wait)";


            statusIcon.innerHTML =
                "⚠️";


            statusText.innerHTML =
                "KONEKSI TERPUTUS";


            statusSub.innerText =
                "Tidak dapat menghubungi Cloudflare Worker...";


            dbValue.innerText =
                "0.0";


            buzzerToggle.checked =
                false;

            buzzerToggle.disabled =
                true;


            console.error(
                "[SERVER ERROR]",
                error
            );
        }
    }


    // =====================================================
    // POLLING SETIAP 500 ms
    // =====================================================

    setInterval(
        fetchESP32Data,
        POLLING_INTERVAL
    );


    // =====================================================
    // REQUEST PERTAMA
    // =====================================================

    fetchESP32Data();

</script>
